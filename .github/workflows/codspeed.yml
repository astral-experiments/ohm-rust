name: Compiler performance artifact repeat

# Temporary experiment on the registered workflow path; no compiler build or push/PR trigger.
# Dispatch twice with the same candidate coordinates, selecting baseline then candidate.
# One compiler per run keeps duplicate benchmark names out of the same CodSpeed run.
on:
  workflow_dispatch:
    inputs:
      compiler:
        description: Compiler artifact to repeat
        type: choice
        options: [baseline, candidate]
        required: true
        default: candidate
      candidate_sha:
        description: Full source SHA of the selected candidate (fill after selecting a winner)
        type: string
        required: true
      candidate_run_id:
        description: Compiler performance run containing the selected candidate artifact
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.compiler }}
  cancel-in-progress: false

jobs:
  codspeed:
    name: Compiler Walltime repeat (${{ inputs.compiler }}, ${{ matrix.shard }})
    runs-on: codspeed-macro
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [ruff-ty_python_semantic, uv-resolver]
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      BASELINE_SHA: 7d2c9ee7651076a9930b109f3738a1c6cb4dbb29
      COMPILER_VARIANT: ${{ inputs.compiler }}
      COMPILER_SHA: ${{ inputs.compiler == 'baseline' && '7d2c9ee7651076a9930b109f3738a1c6cb4dbb29' || inputs.candidate_sha }}
      COMPILER_RUN_ID: ${{ inputs.compiler == 'baseline' && '33963601483' || inputs.candidate_run_id }}
      BENCHMARK_SHARD: ${{ matrix.shard }}
    steps:
      - name: Resolve exact compiler artifact from the selected run
        id: artifact
        shell: bash
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          revision = os.environ["COMPILER_SHA"]
          run_id = os.environ["COMPILER_RUN_ID"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("The compiler revision must be a full lowercase 40-digit SHA")
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("The compiler workflow run ID must be a positive integer")
          repository = os.environ["GITHUB_REPOSITORY"]
          endpoint = f"{os.environ['GITHUB_API_URL']}/repos/{repository}/actions/runs/{run_id}"
          def read_json(url):
              request = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['ARTIFACT_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = read_json(endpoint)
          if run["head_sha"] != revision:
              raise SystemExit(f"Run {run_id} was built from {run['head_sha']}, not {revision}")
          artifacts = read_json(endpoint + "/artifacts?per_page=100")
          matches = [a for a in artifacts["artifacts"] if a["name"] == "codspeed-toolchain"]
          if len(matches) != 1 or matches[0]["expired"]:
              raise SystemExit(f"Run {run_id} must have one unexpired codspeed-toolchain artifact")
          artifact = matches[0]
          if os.environ["COMPILER_VARIANT"] == "baseline":
              if artifact["id"] != 9968907906 or artifact["digest"] != (
                  "sha256:d00c119a00376cbf43524bea83c69a905421c3339f8b125710163135b6b765c0"
              ):
                  raise SystemExit("The fixed baseline artifact identity changed")
          metadata = {
              "source_sha": revision,
              "compiler_run_id": int(run_id),
              "compiler_run_url": run["html_url"],
              "artifact_id": artifact["id"],
              "artifact_digest": artifact["digest"],
              "artifact_size_bytes": artifact["size_in_bytes"],
              "artifact_expires_at": artifact["expires_at"],
          }
          record = Path(os.environ["RUNNER_TEMP"]) / "codspeed-repeat-artifact.json"
          record.write_text(json.dumps(metadata, indent=2) + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"id={artifact['id']}\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Checkout matching compiler source and benchmark harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.COMPILER_SHA }}
          fetch-depth: 128
          persist-credentials: false

      - name: Checkout pinned benchmark dependencies
        run: git submodule update --init --depth 1 src/tools/rustc-perf

      - name: Download exact benchmark compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          run-id: ${{ env.COMPILER_RUN_ID }}
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: build

      - name: Unpack benchmark compiler
        run: |
          mkdir -p build/codspeed-toolchain
          tar -xzf build/codspeed-toolchain.tar.gz -C build/codspeed-toolchain

      - name: Checkout Ruff benchmark sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/ruff
          ref: efcffd2178ce62e9951a53d4c50cadc225a0cfec
          path: build/codspeed-sources/ruff
          persist-credentials: false

      - name: Checkout uv benchmark sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/uv
          ref: 3392e29bdc4f09bb4f6d92f7aca8d450b835ce4f
          path: build/codspeed-sources/uv
          persist-credentials: false

      - name: Install benchmark tools
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: src/tools/codspeed/requirements.txt

      - name: Install benchmark dependencies
        run: |
          uv venv --python 3.13.15 src/tools/codspeed/.venv
          uv pip sync --python src/tools/codspeed/.venv/bin/python --require-hashes \
            src/tools/codspeed/requirements.txt

      - name: Check benchmark harness
        run: >-
          src/tools/codspeed/.venv/bin/python -m pytest
          src/tools/codspeed/test_harness.py
          src/tools/codspeed/test_walltime_results.py

      - name: Verify compiler revision, host, and unchanged harness
        shell: bash
        run: |
          src/tools/codspeed/.venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import tomllib
          from pathlib import Path

          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["COMPILER_SHA"]
          if revision != expected:
              raise SystemExit(f"Source revision mismatch: {revision} != {expected}")
          version = subprocess.check_output(
              ["build/codspeed-toolchain/stage1/bin/rustc", "-vV"], text=True
          )
          print(version, end="")
          fields = dict(line.split(": ", 1) for line in version.splitlines() if ": " in line)
          if fields.get("commit-hash") != expected:
              raise SystemExit("Compiler full commit hash does not match the selected source")
          if fields.get("host") != "aarch64-unknown-linux-gnu":
              raise SystemExit(f"Unexpected compiler host: {fields.get('host')}")
          if platform.machine() not in ("aarch64", "arm64"):
              raise SystemExit(f"Unexpected runner architecture: {platform.machine()}")
          subprocess.run(
              ["git", "diff", "--exit-code", os.environ["BASELINE_SHA"], revision,
               "--", "src/tools/codspeed", "src/tools/rustc-perf",
               ":(exclude,literal)src/tools/codspeed/bootstrap.toml"], check=True
          )
          config_path = "src/tools/codspeed/bootstrap.toml"
          baseline_config_bytes, candidate_config_bytes = (
              subprocess.check_output(["git", "show", f"{sha}:{config_path}"])
              for sha in (os.environ["BASELINE_SHA"], revision)
          )
          baseline_config = tomllib.loads(baseline_config_bytes.decode("utf-8"))
          candidate_config = tomllib.loads(candidate_config_bytes.decode("utf-8"))
          baseline_lto = baseline_config["rust"]["lto"]
          candidate_lto = candidate_config["rust"]["lto"]

          def config_signature(config):
              # Preserve TOML value types: false must differ from 0, for example.
              return json.dumps(config, sort_keys=True, allow_nan=False)

          config_variant = "unchanged"
          candidate_signature = config_signature(candidate_config)
          if candidate_signature != config_signature(baseline_config):
              allowed_config = baseline_config | {
                  "rust": baseline_config["rust"] | {"lto": "thin"},
              }
              if (baseline_lto != "thin-local" or candidate_lto != "thin"
                      or candidate_signature != config_signature(allowed_config)):
                  raise SystemExit("Only rust.lto thin-local -> thin may change in the build config")
              config_variant = "thin-lto"

          evidence = Path("build/codspeed-repeat")
          evidence.mkdir(parents=True, exist_ok=True)
          record = Path(os.environ["RUNNER_TEMP"]) / "codspeed-repeat-artifact.json"
          metadata = json.loads(record.read_text())
          with Path("build/codspeed-toolchain.tar.gz").open("rb") as archive:
              archive_hash = hashlib.file_digest(archive, "sha256").hexdigest()
          metadata.update({
              "checked_out_sha": revision,
              "rustc_version": version,
              "runner_architecture": platform.machine(),
              "toolchain_archive_sha256": archive_hash,
              "harness_baseline_sha": os.environ["BASELINE_SHA"],
              "compiler_build_config": {
                  "path": config_path,
                  "baseline_sha256": hashlib.sha256(baseline_config_bytes).hexdigest(),
                  "candidate_sha256": hashlib.sha256(candidate_config_bytes).hexdigest(),
                  "baseline_lto": baseline_lto,
                  "candidate_lto": candidate_lto,
                  "variant": config_variant,
              },
              "repeat_run_id": os.environ["GITHUB_RUN_ID"],
              "repeat_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "compiler_variant": os.environ["COMPILER_VARIANT"],
              "shard": os.environ["BENCHMARK_SHARD"],
          })
          (evidence / "compiler.json").write_text(json.dumps(metadata, indent=2) + "\n")
          (evidence / "rustc-version.txt").write_text(version)
          PY

      - name: Prepare dependencies and capture compiler invocations
        run: >-
          src/tools/codspeed/.venv/bin/python src/tools/codspeed/prepare.py
          --rustc build/codspeed-toolchain/stage1/bin/rustc
          --cargo build/codspeed-toolchain/stage0/bin/cargo
          --shard '${{ matrix.shard }}'

      - name: Measure compiler performance
        timeout-minutes: 35
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          runner-version: "5.2.1"
          run: |
            set -e
            src/tools/codspeed/.venv/bin/python -m pytest \
              src/tools/codspeed/test_compiler_walltime.py --codspeed -k '${{ matrix.shard }}'
            cp -r "$CODSPEED_PROFILE_FOLDER/results" build/codspeed/results

      - name: Verify compiler Walltime measurements
        run: >-
          src/tools/codspeed/.venv/bin/python src/tools/codspeed/verify_walltime.py
          build/codspeed --shard '${{ matrix.shard }}'

      - name: Retain compiler measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-repeat-${{ inputs.compiler }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            build/codspeed-repeat/
            build/codspeed/manifest.json
            build/codspeed/results/
          if-no-files-found: ignore
          retention-days: 14
