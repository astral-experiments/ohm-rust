name: Compiler performance

on:
  push:
    branches: [ohm-1.98.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Build benchmark compiler
    runs-on: codspeed-macro
    timeout-minutes: 70
    outputs:
      shards: ${{ steps.shards.outputs.value }}
    steps:
      - name: Checkout candidate compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 128
          persist-credentials: false

      - name: Checkout pinned compiler dependencies
        run: git submodule update --init --depth 1 library/backtrace

      - name: Select benchmark shards
        id: shards
        working-directory: src/tools/codspeed
        run: >-
          python3 -c 'import json; from benchmarks import SHARDS, WORKSPACES;
          print("value=" + json.dumps([{"shard": name, "kind": "compiler"} for name in SHARDS]
          + [{"shard": name, "kind": "workflow"} for name in WORKSPACES]))'
          >> "$GITHUB_OUTPUT"

      - name: Build candidate compiler and matching standard library
        run: >-
          python3 x.py --ci false --config src/tools/codspeed/bootstrap.toml
          build --stage 1 library

      - name: Checkout fixed Ohm Cargo for development workflows
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/ohm-cargo
          ref: 49a7295fc6b46da600c6dca91d188a972d6abcc7
          path: build/codspeed-cargo
          token: ${{ secrets.OHM_CARGO_READ_TOKEN }}
          persist-credentials: false

      - name: Build workflow Cargo with Ohm defaults
        shell: bash
        run: |
          RUSTC="$PWD/build/host/stage0/bin/rustc" CFG_RELEASE_CHANNEL=dev \
            build/host/stage0/bin/cargo build --release --locked \
            --manifest-path build/codspeed-cargo/Cargo.toml \
            --target-dir build/codspeed-cargo-target --features ohm-defaults,all-static
          cp build/codspeed-cargo-target/release/cargo build/host/workflow-cargo

      - name: Package compiler and pinned Cargo
        # Bootstrap links these source directories back to the checkout, including build/.
        run: >-
          tar --dereference -czf build/codspeed-toolchain.tar.gz
          --exclude=stage1/lib/rustlib/src
          --exclude=stage1/lib/rustlib/rustc-src
          -C build/host stage1 stage0/bin/cargo workflow-cargo

      - name: Retain benchmark compiler
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-toolchain
          path: build/codspeed-toolchain.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  codspeed:
    name: ${{ matrix.kind == 'workflow' && 'Development workflows' || 'Compiler Walltime benchmarks' }} (${{ matrix.shard }})
    needs: compiler
    runs-on: codspeed-macro
    timeout-minutes: 70
    env:
      BENCHMARK_KIND: ${{ matrix.kind }}
      RUSTC_CODSPEED_WORKFLOWS: build/codspeed/manifest.json
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compiler.outputs.shards) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout candidate compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 128
          persist-credentials: false

      - name: Checkout pinned benchmark dependencies
        run: git submodule update --init --depth 1 src/tools/rustc-perf

      - name: Download benchmark compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codspeed-toolchain
          path: build

      - name: Unpack benchmark compiler
        run: |
          mkdir -p build/codspeed-toolchain
          tar -xzf build/codspeed-toolchain.tar.gz -C build/codspeed-toolchain

      - name: Checkout Ruff benchmark sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/ruff
          ref: efcffd2178ce62e9951a53d4c50cadc225a0cfec
          path: build/codspeed-sources/ruff
          persist-credentials: false

      - name: Checkout uv benchmark sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/uv
          ref: 3392e29bdc4f09bb4f6d92f7aca8d450b835ce4f
          path: build/codspeed-sources/uv
          persist-credentials: false

      - name: Install benchmark tools
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: src/tools/codspeed/requirements.txt

      - name: Install benchmark dependencies
        run: |
          uv venv --python 3.13.15 src/tools/codspeed/.venv
          uv pip sync --python src/tools/codspeed/.venv/bin/python --require-hashes \
            src/tools/codspeed/requirements.txt

      - name: Check benchmark harness
        run: >-
          src/tools/codspeed/.venv/bin/python -m pytest
          src/tools/codspeed/test_harness.py
          src/tools/codspeed/test_walltime_results.py
          src/tools/codspeed/test_workflows.py

      - name: Verify compiler revision
        shell: bash
        run: |
          version="$(build/codspeed-toolchain/stage1/bin/rustc -vV)"
          printf '%s\n' "$version"
          revision="$(git rev-parse HEAD)"
          if ! grep -Fxq "commit-hash: $revision" <<< "$version"; then
            echo "The benchmark compiler does not match the checked-out revision" >&2
            exit 1
          fi

      - name: Prepare dependencies and capture compiler invocations
        if: matrix.kind == 'compiler'
        run: >-
          src/tools/codspeed/.venv/bin/python src/tools/codspeed/prepare.py
          --rustc build/codspeed-toolchain/stage1/bin/rustc
          --cargo build/codspeed-toolchain/stage0/bin/cargo
          --shard '${{ matrix.shard }}'

      - name: Prepare development workflow snapshots
        if: matrix.kind == 'workflow'
        run: >-
          src/tools/codspeed/.venv/bin/python src/tools/codspeed/workflows.py
          --rustc build/codspeed-toolchain/stage1/bin/rustc
          --cargo build/codspeed-toolchain/workflow-cargo
          --output build/codspeed --shard '${{ matrix.shard }}'

      - name: Measure compiler performance
        timeout-minutes: 50
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          runner-version: "5.2.1"
          run: |
            set -e
            if [ "$BENCHMARK_KIND" = workflow ]; then
              suite=src/tools/codspeed/test_workflow_walltime.py
            else
              suite=src/tools/codspeed/test_compiler_walltime.py
            fi
            src/tools/codspeed/.venv/bin/python -m pytest "$suite" --codspeed -k '${{ matrix.shard }}'
            cp -r "$CODSPEED_PROFILE_FOLDER/results" build/codspeed/results

      - name: Verify compiler Walltime measurements
        shell: bash
        run: |
          mode=()
          if [ "$BENCHMARK_KIND" = workflow ]; then
            mode=(--workflows)
          fi
          src/tools/codspeed/.venv/bin/python src/tools/codspeed/verify_walltime.py \
            build/codspeed --shard '${{ matrix.shard }}' "${mode[@]}"

      - name: Retain compiler measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-walltime-evidence-${{ matrix.kind == 'workflow' && 'workflow-' || '' }}${{ matrix.shard }}
          path: |
            build/codspeed/manifest.json
            build/codspeed/results/
            build/codspeed/*/*.log
          if-no-files-found: ignore
          retention-days: 14
