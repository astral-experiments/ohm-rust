name: Release artifact comparison

# Temporary experiment on this registered workflow path; no push/PR trigger.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build the candidate, compare saved artifacts, or do both
        type: choice
        options: [build-only, build-and-compare, compare-only]
        default: build-and-compare
      candidate_artifact:
        description: 'For compare-only: JSON with artifact_id, run_id, workflow_revision, digest (optional bytes)'
        type: string
        default: ''
      cycles:
        description: Measured ABBA cycles after two warmups
        type: choice
        options: ['1', '3']
        default: '3'
      shard:
        description: Release workload to compare
        type: choice
        options:
          - uv-release-resolver
          - codex-release-protocol
        default: codex-release-protocol

permissions:
  contents: read
  actions: read

concurrency:
  group: release-artifact-comparison-107-candidate
  cancel-in-progress: false

jobs:
  compiler:
    name: Build reviewed candidate on ARM64
    if: ${{ inputs.operation != 'compare-only' }}
    runs-on: codspeed-macro
    timeout-minutes: 50
    outputs:
      artifact: ${{ steps.selection.outputs.artifact }}
    steps:
      - name: Checkout experiment harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact 107 compiler source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 4627d2156ce9cb9889f48c34f2ecf018150c6bb0
          fetch-depth: 128
          path: build/compiler-candidate
          persist-credentials: false

      - name: Apply only the reviewed scheduling change
        run: >-
          python3 src/tools/codspeed/compare_release_artifacts.py
          --prepare-candidate-source build/compiler-candidate

      - name: Checkout pinned compiler dependencies
        working-directory: build/compiler-candidate
        run: git submodule update --init --depth 1 library/backtrace

      - name: Build candidate compiler and matching standard library
        working-directory: build/compiler-candidate
        run: >-
          python3 x.py --ci false --config src/tools/codspeed/bootstrap.toml
          build --stage 1 library

      - name: Record candidate source and runtime
        run: >-
          python3 src/tools/codspeed/compare_release_artifacts.py
          --record-candidate-build build/compiler-candidate

      - name: Package compiler and pinned Cargo
        working-directory: build/compiler-candidate
        run: >-
          tar --dereference -czf build/codspeed-toolchain.tar.gz
          --exclude=stage1/lib/rustlib/src
          --exclude=stage1/lib/rustlib/rustc-src
          -C build/host stage1 stage0/bin/cargo

      - name: Retain reusable candidate compiler
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-toolchain-candidate
          path: |
            build/compiler-candidate/build/codspeed-toolchain.tar.gz
            build/compiler-candidate/build/candidate-build.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Export candidate artifact selection
        id: selection
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import json, os
          artifact = {"artifact_id": int(os.environ["ARTIFACT_ID"]),
                      "run_id": int(os.environ["GITHUB_RUN_ID"]),
                      "workflow_revision": os.environ["GITHUB_SHA"],
                      "digest": os.environ["ARTIFACT_DIGEST"]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("artifact=" + json.dumps(artifact) + "\n")
          print(json.dumps(artifact))
          PY

  compare:
    name: Raw Release walltime (107 vs candidate, ${{ inputs.shard }})
    needs: compiler
    if: ${{ always() && !cancelled() && inputs.operation != 'build-only' && (needs.compiler.result == 'success' || inputs.operation == 'compare-only') }}
    env:
      CANDIDATE_ARTIFACT: ${{ needs.compiler.outputs.artifact || inputs.candidate_artifact }}
    runs-on: codspeed-macro
    timeout-minutes: 50
    steps:
      - name: Checkout experiment harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned artifact metadata
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 src/tools/codspeed/compare_release_artifacts.py --check-artifacts
          --candidate-artifact "$CANDIDATE_ARTIFACT"

      - name: Download exact 107 compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: astral-sh/ohm-rust
          run-id: 33842773781
          artifact-ids: 9926674271
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: build/release-comparison/downloads/A

      - name: Download reviewed candidate compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: astral-sh/ohm-rust
          run-id: ${{ steps.artifacts.outputs.candidate-run-id }}
          artifact-ids: ${{ steps.artifacts.outputs.candidate-artifact-id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: build/release-comparison/downloads/B

      - name: Unpack the independent toolchains
        run: |
          for arm in A B; do
            mkdir -p "build/release-comparison/toolchains/$arm"
            tar -xzf "build/release-comparison/downloads/$arm/codspeed-toolchain.tar.gz" \
              --no-same-owner -C "build/release-comparison/toolchains/$arm"
          done

      # prepare.py verifies these sources even for a workspace-only shard.
      - name: Checkout pinned rustc-perf fixtures
        run: git submodule update --init --depth 1 src/tools/rustc-perf

      - name: Checkout pinned Ruff workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/ruff
          ref: efcffd2178ce62e9951a53d4c50cadc225a0cfec
          path: build/codspeed-sources/ruff
          persist-credentials: false

      - name: Checkout pinned UV workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/uv
          ref: 3392e29bdc4f09bb4f6d92f7aca8d450b835ce4f
          path: build/codspeed-sources/uv
          persist-credentials: false

      - name: Checkout pinned Codex workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openai/codex
          ref: 74004b5397b24662a87a5264a6ae80664168c7f3
          path: build/codspeed-sources/codex
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.7
          enable-cache: false

      - name: Prepare the existing pinned Python harness
        # No inherited private index credentials or user configuration.
        run: |
          env -i PATH="$PATH" HOME="$HOME" UV_CACHE_DIR="$PWD/build/release-python-cache" \
            uv --no-config venv --python 3.13.15 src/tools/codspeed/.venv
          env -i PATH="$PATH" HOME="$HOME" UV_CACHE_DIR="$PWD/build/release-python-cache" \
            uv --no-config pip sync --python src/tools/codspeed/.venv/bin/python \
            --default-index https://pypi.org/simple --require-hashes src/tools/codspeed/requirements.txt

      - name: Check the harness without compiler invocations
        run: >-
          src/tools/codspeed/.venv/bin/python -m pytest
          src/tools/codspeed/test_harness.py src/tools/codspeed/test_walltime_results.py

      - name: Prepare dependencies and compare Release compilation
        # The Python process replaces its inherited env before preparation and
        # compiler calls. Setup/source restoration/JSON writes are not timed.
        # A process-group timeout leaves time for evidence upload within 50 min.
        env:
          SHARD: ${{ inputs.shard }}
          CYCLES: ${{ inputs.cycles }}
        run: >-
          timeout --signal=TERM --kill-after=30s 44m
          src/tools/codspeed/.venv/bin/python src/tools/codspeed/compare_release_artifacts.py --shard "$SHARD"
          --cycles "$CYCLES" --candidate-artifact "$CANDIDATE_ARTIFACT"

      - name: Retain raw comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.shard }}-107-candidate-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-comparison/evidence
          if-no-files-found: warn
          retention-days: 14
