name: Validate measured compiler candidates (7b53)

on:
  push:
    branches: [charlie/codex-codspeed-verify-7b53]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/charlie/codex-codspeed-verify-7b53' }}
    name: Validate measured compiler (${{ matrix.kind }})
    runs-on: codspeed-macro
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: folds
            sha: d9b0fecdbe558ff6a1022982ff68e5faf04c98b0
            run: 33964529181
          - kind: mir
            sha: 861d55a0be872c0b47ea71e2fac044420e8f0198
            run: 33964702894
          - kind: instantiation
            sha: b5e4d14dc9797f71a49561906d0a9cda53ac1842
            run: 33965090737
    steps:
      - name: Checkout validation script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: src/tools/codspeed
          persist-credentials: false

      - name: Checkout exact measured source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: Download measured compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codspeed-toolchain
          run-id: ${{ matrix.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build

      - name: Validate measured compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/codspeed-toolchain
          tar -xzf build/codspeed-toolchain.tar.gz -C build/codspeed-toolchain
          python3 src/tools/codspeed/verify_candidates_7b53.py \
            '${{ matrix.kind }}' source \
            build/codspeed-toolchain/stage1/bin/rustc build/validation

      - name: Retain validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-validation-${{ matrix.kind }}-7b53
          path: |
            build/validation/*.json
            build/validation/*.jsonl
            build/validation/*.txt
          if-no-files-found: warn
          retention-days: 7
