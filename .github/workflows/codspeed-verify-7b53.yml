name: Validate measured compiler candidates (7b53)

on:
  push:
    branches: [charlie/codex-codspeed-verify-7b53]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/charlie/codex-codspeed-verify-7b53' }}
    name: Validate measured compiler (${{ matrix.kind }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: wf_adt
            sha: a62dbad7aa17c1f4239e081218090a12f0c33291
            run: 33973221790
    steps:
      - name: Checkout validation script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: src/tools/codspeed
          persist-credentials: false

      - name: Checkout exact measured source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: Download measured compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codspeed-toolchain
          run-id: ${{ matrix.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build

      - name: Validate measured compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/codspeed-toolchain
          tar -xzf build/codspeed-toolchain.tar.gz -C build/codspeed-toolchain
          python3 src/tools/codspeed/verify_candidates_7b53.py \
            '${{ matrix.kind }}' source \
            build/codspeed-toolchain/stage1/bin/rustc build/validation

      - name: Retain validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-validation-${{ matrix.kind }}-7b53
          path: |
            build/validation/*.json
            build/validation/*.jsonl
            build/validation/*.txt
          if-no-files-found: warn
          retention-days: 7
