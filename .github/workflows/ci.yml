name: CI

on:
  push:
    branches:
      - ohm-1.98.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    if: ${{ github.ref != 'refs/heads/charlie/codex-codspeed-arm-self-profile' }}
    name: Formatting and tidy
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - name: Checkout Rust
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 128

      - name: Install the pinned nightly formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-06-25
          components: rustfmt

      - name: Checkout the standard-library backtrace submodule
        run: git submodule update --init --depth 1 library/backtrace

      - name: Check formatting
        run: >-
          python3 x.py --set build.submodules=false
          --set build.rustfmt=$(rustup which --toolchain nightly-2026-06-25 rustfmt)
          fmt --check

      - name: Run tidy checks
        run: >-
          env -u GITHUB_ACTIONS python3 x.py --ci false --set build.submodules=false
          --set build.rustfmt=$(rustup which --toolchain nightly-2026-06-25 rustfmt)
          test tidy

  compiler:
    if: ${{ github.ref != 'refs/heads/charlie/codex-codspeed-arm-self-profile' }}
    name: ${{ matrix.os == 'depot-ubuntu-24.04-16' && 'Compiler and regression tests' || 'Compiler and regression tests (macOS)' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04-16, namespace-profile-macos-15]
    steps:
      - name: Checkout Rust
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 128

      - name: Checkout the standard-library backtrace submodule
        run: git submodule update --init --depth 1 library/backtrace

      - name: Check compiler crates
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off --warnings deny check compiler

      - name: Run bootstrap and component PGO tests
        shell: bash
        run: |
          stage0_cargo="$(
            find "$PWD/build" -mindepth 4 -maxdepth 4 \
              -path '*/stage0/bin/cargo' -type f -print -quit
          )"
          if [[ -z "$stage0_cargo" ]]; then
            echo 'compiler check did not produce its bootstrap Cargo toolchain' >&2
            exit 1
          fi

          stage0_rustc="$(dirname -- "$stage0_cargo")/rustc"
          if [[ ! -x "$stage0_rustc" ]]; then
            echo "bootstrap Rust compiler is missing: $stage0_rustc" >&2
            exit 1
          fi

          export RUSTC="$stage0_rustc"
          export CARGO="$stage0_cargo"
          export RUSTC_BOOTSTRAP=1
          export CARGO_TARGET_DIR="$PWD/build/component-pgo-tests"

          "$stage0_cargo" test --locked --manifest-path src/bootstrap/Cargo.toml pgo_
          "$stage0_cargo" test --locked --manifest-path src/bootstrap/Cargo.toml copy_link_tests
          "$stage0_cargo" test --locked -p opt-dist

      - name: Run incremental driver input regression
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 compiler/rustc_interface
          --test-args incremental_driver_hash_does_not_change_crate_identity

      - name: Run Cranelift directory-copy tests
        run: |
          build/host/stage0/bin/rustc --edition=2021 --test \
            compiler/rustc_codegen_cranelift/build_system/main.rs -o build/cranelift-directory-copy-tests
          build/cranelift-directory-copy-tests utils::copy_tests

      - name: Run metadata UI tests
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 tests/ui/rmeta

      - name: Run LLVM prelink function-merging regression
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 tests/codegen-llvm/merge-functions-prelink.rs

      - name: Run coroutine runtime layout regression tests
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1
          tests/ui/coroutine/metadata-sufficient-for-layout.rs
          tests/ui/coroutine/xcrate.rs tests/ui/coroutine/drop-env.rs
          tests/ui/async-await/async-closures/drop.rs
          tests/ui/async-await/async-closures/by-move-body-inlined-attrs.rs
          tests/ui/async-await/async-drop/metadata-only-layout.rs
          tests/ui/ohm/clippy-codegen-mir.rs
          tests/ui/pattern/non-structural-match-types-cycle-err.rs
          tests/incremental/coroutine-runtime-layout.rs

      - name: Run unused-dependency JSON UI tests
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 tests/ui/unused-crate-deps

      - name: Run well-formedness obligation regression tests
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 tests/ui/wf/nominal-inherited-obligations.rs
          tests/ui/wf/nominal-inherited-obligations-fail.rs
          tests/incremental/nominal-inherited-obligations.rs

      - name: Run cached hygiene unit tests
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 compiler/rustc_span --test-args hygiene::tests

      - name: Run parallel cache promotion incremental tests
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1
          --compiletest-rustc-args=-Zthreads=8
          --compiletest-rustc-args=-Zincremental-verify-ich
          tests/incremental/hygiene tests/incremental/derive_macro_expansion
          tests/incremental/promote-cached-query-value.rs
          tests/incremental/forward-cached-query-value.rs

      - name: Run retained allocation identity test
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 compiler/rustc_middle
          --test-args aliases_preserve_allocation_identity

      - name: Run incremental directory copy tests
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 compiler/rustc_fs_util
          tests/run-make/incremental-directory-copy tests/run-make/incremental-session-fail

      - name: Run reduced-dependency-rebuild and monomorphization incremental tests
        if: hashFiles('tests/incremental/rdr/**/*.rs') != ''
        run: >-
          python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true
          --set rust.lto=off test --stage 1 tests/incremental/rdr
          tests/incremental/mono_item_partition_body_change.rs
          tests/incremental/mono_item_partition_caller_local_body_change.rs
          tests/incremental/mono_item_partition_library_body_change.rs
          tests/incremental/mono_item_partition_library_distinct_edges.rs
          tests/incremental/mono_item_partition_stable_merging.rs
          tests/incremental/mono_item_partition_test_body_change.rs
          tests/incremental/mono_item_partition_test_changed_edges.rs
          tests/incremental/mono_item_partition_test_reordered_edges.rs
          tests/incremental/mono_item_partition_test_unreachable_const.rs
          tests/incremental/mono_item_partition_unreachable_const.rs
          tests/incremental/mono_item_partition_unreachable_const_cached.rs

      - name: Run focused compiler run-make tests
        shell: bash
        run: |
          tests=(
            tests/run-make/public-api-hash*
            tests/run-make/rdr-public-hash*
            tests/run-make/caller-local-codegen
            tests/run-make/unused-externs-transparent
            tests/run-make/reset-codegen-1
            tests/run-make/stable-cgu-merging
            tests/run-make/test-harness-exact-filter
            tests/run-make/parallel-query-depth-limits
            tests/run-make/incremental-lint-visibilities
            tests/run-make/split-debuginfo-incremental
          )
          selected=()

          for test in "${tests[@]}"; do
            if [[ -d "$test" ]]; then
              selected+=("$test")
            fi
          done

          if (( ${#selected[@]} > 0 )); then
            python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true \
              --set rust.lto=off test --stage 1 "${selected[@]}"
          fi

  arm_self_profile:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/codex-codspeed-arm-self-profile' }}
    name: Profile exact bitmaps incremental compiler
    runs-on: codspeed-macro
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 5f201816f43d7b89b4a9a2ffac332f2196da9365
          persist-credentials: false
      - name: Checkout pinned benchmark dependencies
        run: git submodule update --init --depth 1 src/tools/rustc-perf
      - name: Download exact benchmark compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codspeed-toolchain
          run-id: 33950241981
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build
      - name: Unpack benchmark compiler
        run: |
          mkdir -p build/codspeed-toolchain
          tar -xzf build/codspeed-toolchain.tar.gz -C build/codspeed-toolchain
      - name: Checkout pinned Ruff benchmark source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/ruff
          ref: efcffd2178ce62e9951a53d4c50cadc225a0cfec
          path: build/codspeed-sources/ruff
          persist-credentials: false
      - name: Checkout pinned uv benchmark source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: astral-sh/uv
          ref: 3392e29bdc4f09bb4f6d92f7aca8d450b835ce4f
          path: build/codspeed-sources/uv
          persist-credentials: false
      - name: Install benchmark tools
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Install pinned benchmark dependencies
        run: |
          uv venv --python 3.13.15 src/tools/codspeed/.venv
          uv pip sync --python src/tools/codspeed/.venv/bin/python --require-hashes src/tools/codspeed/requirements.txt
      - name: Capture one compiler self-profile
        shell: bash
        run: |
          set -euo pipefail
          src/tools/codspeed/.venv/bin/python src/tools/codspeed/prepare.py \
            --rustc build/codspeed-toolchain/stage1/bin/rustc \
            --cargo build/codspeed-toolchain/stage0/bin/cargo \
            --shard bitmaps-3.2.1
          src/tools/codspeed/.venv/bin/python - <<'PY_PROFILE'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('src/tools/codspeed').resolve()))
          from test_compiler_walltime import prepare_invocation

          sha = '5f201816f43d7b89b4a9a2ffac332f2196da9365'
          manifest = json.loads(Path('build/codspeed/manifest.json').read_text())
          assert f'commit-hash: {sha}' in manifest['rustc_version'].splitlines()
          assert manifest['suite_revision'] == 'c0301bc44d175b9b2c5442b25049475c39d7700c'
          (fixture,) = [f for f in manifest['fixtures'] if f['name'] == 'bitmaps-3.2.1']
          (command,), kwargs = prepare_invocation(fixture, 'IncrFull')
          profile = Path('build/profile').resolve()
          profile.mkdir(parents=True, exist_ok=True)
          assert command[0] == str(Path('build/codspeed-toolchain/stage1/bin/rustc').resolve())
          with (profile / 'rustc-stderr.txt').open('w') as stderr:
              subprocess.run([*command, f'-Zself-profile={profile}'], stderr=stderr, **kwargs)
          files = sorted(profile.glob('bitmaps-*.mm_profdata'))
          assert len(files) == 1 and files[0].stat().st_size > 0, files
          (profile / 'profile-path.txt').write_text(str(files[0]) + '\n')
          PY_PROFILE
          CARGO_TARGET_DIR="$RUNNER_TEMP/measureme-target" \
            RUSTC="$PWD/build/codspeed-toolchain/stage1/bin/rustc" \
            build/codspeed-toolchain/stage0/bin/cargo install \
              --git https://github.com/rust-lang/measureme \
              --rev 5ac839c602b59eee9c908b3b35b6d6c0cd1c42f7 \
              --root "$RUNNER_TEMP/measureme" summarize
          "$RUNNER_TEMP/measureme/bin/summarize" summarize \
            "$(cat build/profile/profile-path.txt)" --percent-above 0.05 \
            > build/profile/query-summary.txt
          head -80 build/profile/query-summary.txt
      - name: Retain compact query summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitmaps-incrfull-query-profile
          path: |
            build/profile/query-summary.txt
            build/profile/rustc-stderr.txt
            build/codspeed/manifest.json
          if-no-files-found: warn
          retention-days: 2
