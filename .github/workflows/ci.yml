name: CI

on:
  push:
    branches:
      - ohm-1.97.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Formatting and tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Rust
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install the pinned nightly formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-13
          components: rustfmt

      - name: Checkout the standard-library backtrace submodule
        run: git submodule update --init --depth 1 library/backtrace

      - name: Check formatting
        run: >-
          python3 x.py --config .github/ohm-bootstrap.toml
          --set build.rustfmt=$(rustup which --toolchain nightly-2026-05-13 rustfmt)
          fmt --check

      - name: Run tidy checks
        run: >-
          python3 x.py --config .github/ohm-bootstrap.toml --ci false
          --set build.rustfmt=$(rustup which --toolchain nightly-2026-05-13 rustfmt)
          test tidy

  compiler:
    name: Compiler and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Rust
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Checkout the standard-library backtrace submodule
        run: git submodule update --init --depth 1 library/backtrace

      - name: Check compiler crates
        run: python3 x.py --config .github/ohm-bootstrap.toml --warnings deny check compiler

      - name: Run metadata UI tests
        run: python3 x.py --config .github/ohm-bootstrap.toml test --stage 1 tests/ui/rmeta

      - name: Run reduced-dependency-rebuild incremental tests
        if: hashFiles('tests/incremental/rdr/**/*.rs') != ''
        run: python3 x.py --config .github/ohm-bootstrap.toml test --stage 1 tests/incremental/rdr

      - name: Run public-API-hash run-make tests
        shell: bash
        run: |
          tests=(tests/run-make/public-api-hash* tests/run-make/rdr-public-hash*)
          selected=()

          for test in "${tests[@]}"; do
            if [[ -d "$test" ]]; then
              selected+=("$test")
            fi
          done

          if (( ${#selected[@]} > 0 )); then
            python3 x.py --config .github/ohm-bootstrap.toml test --stage 1 "${selected[@]}"
          fi
