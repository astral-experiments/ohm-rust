name: Verify the Ohm -25 literal tables and codegen partitions
run-name: Run both compiler regressions at e9a345479d on ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      retain_linux_runtime:
        description: Export the verified Linux compiler for the paired Cargo smoke
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  combined:
    name: Combined compiler regressions on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.retain_linux_runtime && '["namespace-profile-ubuntu-24-04-16"]' || '["namespace-profile-ubuntu-24-04-16","namespace-profile-macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e9a345479da8838f597c780794026ae5fc0e84ea
          fetch-depth: 0

      - name: Verify the compiler source, Cargo submodule and both tests
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/combined-proof"
          mkdir -p "$proof"
          test "$(git rev-parse HEAD)" = e9a345479da8838f597c780794026ae5fc0e84ea
          test "$(git ls-tree HEAD src/tools/cargo | awk '{print $3}')" = 9da60dfb39fbd3135682c4519714471e45c2921b
          git diff --exit-code HEAD -- compiler tests/run-make
          git show -s --format='%H%n%T%n%P' HEAD > "$proof/source.txt"
          git ls-tree HEAD src/tools/cargo >> "$proof/source.txt"
          git ls-tree HEAD tests/run-make/static-integer-array-literals tests/run-make/ohm-split-large-cgus >> "$proof/source.txt"
          grep -F 'thir.matches("LiteralArray(").count(), 8' tests/run-make/static-integer-array-literals/rmake.rs
          test -s tests/run-make/ohm-split-large-cgus/derived.rs
          git submodule update --init --depth 1 library/backtrace

      - name: Run each native run-make test and require an executed pass
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/combined-proof"
          for suite in static-integer-array-literals ohm-split-large-cgus; do
            logfile="$proof/$suite.txt"
            python3 x.py --set rust.omit-git-hash=false --ci false --set build.submodules=false --set rust.debug-assertions=true \
              --set rust.lto=off test --stage 1 "tests/run-make/$suite" 2>&1 | tee "$logfile"
            python3 - "$logfile" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          assert re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", log), log[-2500:]
          PY
          done
          host=$(find build -maxdepth 3 -mindepth 3 -type d -path '*/stage1/bin' | head -1)
          test -x "$host/rustc"
          "$host/rustc" -vV | tee "$proof/rustc-version.txt"
          grep -F 'commit-hash: e9a345479da8838f597c780794026ae5fc0e84ea' "$proof/rustc-version.txt"

      - name: Retain compiler identity and each complete bootstrap log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc25-compiler-tests-${{ runner.os }}
          path: ${{ runner.temp }}/combined-proof/
          if-no-files-found: error
          retention-days: 21

      - name: Bind a portable Linux compiler to the two executed regressions
        if: ${{ inputs.retain_linux_runtime && success() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          stage="$PWD/build/x86_64-unknown-linux-gnu/stage1"
          abi=x86_64-unknown-linux-gnu
          root="$RUNNER_TEMP/interop-sdk"
          packet="$RUNNER_TEMP/interop-packet"
          mkdir -p "$root/bin" "$root/lib/rustlib/$abi" "$packet"
          cp -L "$stage/bin/rustc" "$root/bin/"
          cp -L "$stage/lib"/librustc_driver-*.so "$root/lib/"
          cp -aL "$stage/lib/rustlib/$abi/lib" "$root/lib/rustlib/$abi/"
          if test -d "$stage/lib/rustlib/$abi/bin"; then
            cp -aL "$stage/lib/rustlib/$abi/bin" "$root/lib/rustlib/$abi/"
          fi
          ldd "$stage/lib"/librustc_driver-*.so > "$packet/driver-dependencies.txt"
          python3 - "$packet/driver-dependencies.txt" "$root/lib" <<'PYCODE'
          import pathlib, re, shutil, sys
          lines = pathlib.Path(sys.argv[1]).read_text()
          assert "not found" not in lines
          for name, original in re.findall(r"(?m)^\s*(libLLVM[^\s]+) => (/[^\s]+)", lines):
              shutil.copy2(original, pathlib.Path(sys.argv[2]) / name)
          PYCODE
          "$root/bin/rustc" -vV > "$packet/version.txt"
          grep -F 'commit-hash: e9a345479da8838f597c780794026ae5fc0e84ea' "$packet/version.txt"
          test "$("$root/bin/rustc" --print sysroot)" = "$root"
          printf '%s\n' 'fn main() { println!("{}", u16::from_le_bytes([8, 1])); }' > "$RUNNER_TEMP/interop_probe.rs"
          "$root/bin/rustc" "$RUNNER_TEMP/interop_probe.rs" -o "$RUNNER_TEMP/interop_probe"
          "$RUNNER_TEMP/interop_probe" | tee "$packet/probe-stdout.txt"
          grep -Fx 264 "$packet/probe-stdout.txt"
          cp "$RUNNER_TEMP/combined-proof/source.txt" "$packet/source.txt"
          python3 - "$root" "$packet/runtime.json" <<'PYCODE'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = {}
          for path in sorted(root.rglob("*")):
              if path.is_dir():
                  continue
              assert path.is_file() and not path.is_symlink()
              with path.open("rb") as source:
                  files[str(path.relative_to(root))] = [
                      hashlib.file_digest(source, "sha256").hexdigest(),
                      path.stat().st_size, path.stat().st_mode & 0o777]
          assert len(files) > 40 and "bin/rustc" in files
          pathlib.Path(sys.argv[2]).write_text(json.dumps(files, sort_keys=True, indent=2) + "\n")
          PYCODE
          tar -C "$root" --sort=name --mtime=@0 --owner=0 --group=0 -cf - bin lib | zstd -q -T2 -3 -o "$packet/runtime.tar.zst"
          sha256sum "$packet/runtime.tar.zst" > "$packet/runtime-sha256.txt"

      - name: Upload the source-identified Linux compiler and runtime
        if: ${{ inputs.retain_linux_runtime && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc25-linux-interop-runtime
          path: ${{ runner.temp }}/interop-packet/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
