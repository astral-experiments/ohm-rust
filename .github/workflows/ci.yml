name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-objects:
    name: Build and test both Linux compiler revisions
    if: github.ref == 'refs/heads/charlie/qa-compact-branch-objects'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the enrolled compilers and run native regressions
        run: bash .github/ohm-packed-object-study/run.sh
      - name: Record the failed regression fixture's inode inventory
        if: failure()
        run: |
          fixture=build/x86_64-unknown-linux-gnu/test/run-make/ohm-packed-branch-cache/rmake_out/cache
          if test -d "$fixture"; then
            find "$fixture" -maxdepth 4 -printf '%y\t%i\t%n\t%s\t%b\t%p\n' \
              > "$RUNNER_TEMP/ohm-branch-object-qa/logs/failed-fixture.tsv"
          fi
      - name: Save the native test and compiler provenance logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packed-object-linux-logs
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 4
          if-no-files-found: warn
      - name: Save the matched runtime images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packed-object-linux-sdks
          path: ${{ runner.temp }}/ohm-branch-object-qa/matched-linux-sdks.tar.zst
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
