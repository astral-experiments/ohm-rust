name: Build SDKs for the -22 performance comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sdk:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-ubuntu-24-04-16, namespace-profile-macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up native tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ninja-build gcc-aarch64-linux-gnu
          elif ! command -v ninja >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          fi
      - name: Build both pinned compilers and standard libraries
        run: |
          cp .github/ohm-qa-22/sdk-build.py "$RUNNER_TEMP/build-ohm22.py"
          python3 "$RUNNER_TEMP/build-ohm22.py"
      - name: Preserve checksums, versions and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa22-sdk-proof-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ohm22-sdk/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the two compiler SDKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa22-sdk-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ohm22-sdk/sdk.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 5
