name: Qualify Ohm 1.99.0-21
on: workflow_dispatch
permissions:
  contents: read
jobs:
  qualify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux native inputs and paired uv edit
            runner: namespace-profile-ubuntu-24-04-16
          - name: macOS declared native inputs
            runner: namespace-profile-macos-15
    steps:
      - name: Get qualification scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: harness
          sparse-checkout: .github/ohm-release-qa-21
          persist-credentials: false
      - name: Get the release compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c79998a5cd143c445a4b2528f20953b176a65c5d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Get uv at the measured revision
        if: runner.os == 'Linux'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: astral-sh/uv
          ref: c22e6b71933443e9cd299d4b6ac8de035ed4825b
          path: uv
          persist-credentials: false
      - name: Install Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build ;;
              macOS) HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja ;;
            esac
          fi
      - name: Build and qualify the pinned compiler
        run: python3 harness/.github/ohm-release-qa-21/qualify.py
      - name: Preserve compiler identities, native results and timing logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ohm-21-qualification-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ohm21-qualification/evidence/
          retention-days: 7
          if-no-files-found: warn
