name: Verify the Ohm -25 literal tables and codegen partitions
run-name: Run both compiler regressions at e9a345479d on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    name: Combined compiler regressions on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [namespace-profile-ubuntu-24-04-16, namespace-profile-macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e9a345479da8838f597c780794026ae5fc0e84ea
          fetch-depth: 0

      - name: Verify the compiler source, Cargo submodule and both tests
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/combined-proof"
          mkdir -p "$proof"
          test "$(git rev-parse HEAD)" = e9a345479da8838f597c780794026ae5fc0e84ea
          test "$(git ls-tree HEAD src/tools/cargo | awk '{print $3}')" = 9da60dfb39fbd3135682c4519714471e45c2921b
          git diff --exit-code HEAD -- compiler tests/run-make
          git show -s --format='%H%n%T%n%P' HEAD > "$proof/source.txt"
          git ls-tree HEAD src/tools/cargo >> "$proof/source.txt"
          git ls-tree HEAD tests/run-make/static-integer-array-literals tests/run-make/ohm-split-large-cgus >> "$proof/source.txt"
          grep -F 'thir.matches("LiteralArray(").count(), 8' tests/run-make/static-integer-array-literals/rmake.rs
          test -s tests/run-make/ohm-split-large-cgus/derived.rs
          git submodule update --init --depth 1 library/backtrace

      - name: Run each native run-make test and require an executed pass
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/combined-proof"
          for suite in static-integer-array-literals ohm-split-large-cgus; do
            logfile="$proof/$suite.txt"
            python3 x.py --ci false --set build.submodules=false --set rust.debug-assertions=true \
              --set rust.lto=off test --stage 1 "tests/run-make/$suite" 2>&1 | tee "$logfile"
            python3 - "$logfile" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          assert re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", log), log[-2500:]
          PY
          done
          host=$(find build -maxdepth 3 -mindepth 3 -type d -path '*/stage1/bin' | head -1)
          test -x "$host/rustc"
          "$host/rustc" -vV | tee "$proof/rustc-version.txt"
          grep -F 'commit-hash: e9a345479da8838f597c780794026ae5fc0e84ea' "$proof/rustc-version.txt"

      - name: Retain compiler identity and each complete bootstrap log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc25-compiler-tests-${{ runner.os }}
          path: ${{ runner.temp }}/combined-proof/
          if-no-files-found: error
          retention-days: 21
