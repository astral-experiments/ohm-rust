name: Temporary canonical TypeOp timing (7b53)

on:
  push:
    branches: [charlie/codex-codspeed-proof-timing-7b53]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compiler:
    if: ${{ github.ref == 'refs/heads/charlie/codex-codspeed-proof-timing-7b53' }}
    name: Build instrumented baseline compiler
    runs-on: codspeed-macro
    timeout-minutes: 50
    steps:
      - name: Checkout the reviewed diagnostic source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 128
          persist-credentials: false
      - name: Checkout pinned compiler dependency
        run: git submodule update --init --depth 1 library/backtrace
      - name: Build compiler and matching standard library with timing unset
        run: >-
          env -u OHM_PROOF_TIMING_DIR python3 x.py --ci false
          --config src/tools/codspeed/bootstrap.toml build --stage 1 library
      - name: Package instrumented compiler and pinned Cargo
        run: >-
          tar --dereference -czf build/proof-timing-toolchain.tar.gz
          --exclude=stage1/lib/rustlib/src --exclude=stage1/lib/rustlib/rustc-src
          -C build/host stage1 stage0/bin/cargo
      - name: Retain instrumented compiler
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-timing-toolchain
          path: build/proof-timing-toolchain.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  timings:
    name: Time canonical type operations (${{ matrix.shard }})
    needs: compiler
    runs-on: codspeed-macro
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [ruff-ty_python_semantic, uv-resolver]
    steps:
      - name: Checkout diagnostic source and unchanged benchmark harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 128
          persist-credentials: false
      - name: Checkout pinned benchmark dependency
        run: git submodule update --init --depth 1 src/tools/rustc-perf
      - name: Download instrumented compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: proof-timing-toolchain
          path: build
      - name: Unpack instrumented compiler
        run: |
          mkdir -p build/codspeed-toolchain
          tar -xzf build/proof-timing-toolchain.tar.gz -C build/codspeed-toolchain
      - name: Checkout pinned Ruff
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: astral-sh/ruff
          ref: efcffd2178ce62e9951a53d4c50cadc225a0cfec
          path: build/codspeed-sources/ruff
          persist-credentials: false
      - name: Checkout pinned uv
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: astral-sh/uv
          ref: 3392e29bdc4f09bb4f6d92f7aca8d450b835ce4f
          path: build/codspeed-sources/uv
          persist-credentials: false
      - name: Install pinned benchmark tools
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
      - name: Install pinned Python dependencies
        run: |
          uv venv --python 3.13.15 src/tools/codspeed/.venv
          uv pip sync --python src/tools/codspeed/.venv/bin/python --require-hashes src/tools/codspeed/requirements.txt
      - name: Prepare the ordinary workload with timing unset
        run: >-
          env -u OHM_PROOF_TIMING_DIR src/tools/codspeed/.venv/bin/python src/tools/codspeed/prepare.py
          --rustc build/codspeed-toolchain/stage1/bin/rustc
          --cargo build/codspeed-toolchain/stage0/bin/cargo
          --shard '${{ matrix.shard }}'
      - name: Time one prepared Full leaf invocation
        timeout-minutes: 5
        run: >-
          env -u OHM_PROOF_TIMING_DIR src/tools/codspeed/.venv/bin/python .github/scripts/proof_timing_7b53.py
          --fixture '${{ matrix.shard }}' --expected-commit '${{ github.sha }}'
          --output build/proof-timing
      - name: Retain timing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-timing-${{ matrix.shard }}-7b53
          path: |
            build/codspeed/manifest.json
            build/proof-timing/*.json
            build/proof-timing/*.txt
            build/proof-timing/counters/*
          retention-days: 7
          if-no-files-found: warn
