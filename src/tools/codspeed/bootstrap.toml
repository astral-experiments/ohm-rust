# A fixed, optimized stage-1 compiler for Walltime measurements.
# Release PGO/BOLT and parallel builds are separate workloads.
[build]
docs = false
locked-deps = true
submodules = false

[llvm]
download-ci-llvm = true

[rust]
channel = "dev"
download-rustc = false
optimize = 3
debug-assertions = false
debug-logging = false
incremental = false
debuginfo-level = 1
codegen-units = 16
codegen-units-std = 1
lto = "thin-local"
jemalloc = false
mimalloc = false
omit-git-hash = false
