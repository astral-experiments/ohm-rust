# A fixed, optimized stage-1 compiler for CPU regression measurements.
# Release PGO/BOLT and parallel wall-time measurements are separate workloads.
[build]
docs = false
locked-deps = true
submodules = false

[llvm]
download-ci-llvm = true

[rust]
channel = "dev"
download-rustc = false
optimize = 3
debug-assertions = false
debug-logging = false
incremental = false
debuginfo-level = 1
codegen-units = 16
codegen-units-std = 1
lto = "thin-local"
omit-git-hash = false
